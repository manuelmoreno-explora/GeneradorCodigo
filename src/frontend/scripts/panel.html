<script>
  (function () {
    const $ = Ui.$;
    const TIPOS = ['RECEPCION', 'ENTREGA'];
    const NOMBRE = { RECEPCION: 'Recibida', ENTREGA: 'Enviada' };

    async function cargar() {
      $('panel-carga').hidden = false;
      $('panel-carga').textContent = 'Cargando…';
      try {
        const r = await Api.obtenerPanel();
        if (!r.ok) throw new Error(r.mensaje);
        const s = r.resumen;
        $('panel-anio').textContent = s.anio;
        TIPOS.forEach((t) => {
          const x = s.porTipo[t];
          $('p-contador-' + t).textContent = x.contador;
          const partes = [x.completadas + ' completadas', x.anuladas + ' anuladas'];
          if (x.base > 0) partes.push('histórico manual hasta ' + x.base);
          $('p-detalle-' + t).textContent = partes.join(' · ');
        });
        $('panel-cifras').hidden = false;
        $('panel-validar').hidden = false;
        $('panel-carga').hidden = true;
        $('panel-ultima').textContent = r.ultimaValidacion
          ? 'Última validación automática (' + r.ultimaValidacion.fecha + '): ' + r.ultimaValidacion.texto
          : 'Aún no hay validación automática. Ejecuta instalarTriggerValidacion() en Apps Script para programarla.';
        pintarAtascadas(r);
      } catch (e) {
        $('panel-carga').textContent = e.message;
      }
    }

    function pintarAtascadas(r) {
      $('panel-atascadas').hidden = !(r.puedeMantener && r.atascadas.length);
      const lista = $('lista-atascadas');
      lista.replaceChildren();
      r.atascadas.forEach((a) => {
        const li = Ui.el('li', 'flex flex-wrap items-center justify-between gap-2 py-3');
        li.appendChild(Ui.el('span', 'font-semibold tabular-nums', a.codigo + ' · ' + Ui.etiquetaTipo(a.tipo) + ' · ' + a.usuario));
        const b = Ui.el('button', 'btn-secondary', 'Resolver');
        b.type = 'button';
        b.addEventListener('click', async () => {
          b.disabled = true;
          const res = await Api.resolverReservaAtascada(a.codigo, a.tipo).catch((e) => ({ ok: false, mensaje: e.message }));
          Ui.toast(res.mensaje);
          cargar();
        });
        li.appendChild(b);
        lista.appendChild(li);
      });
    }

    function pintarValidacion(v, texto) {
      const caja = $('validacion-resultado');
      caja.hidden = false;
      caja.replaceChildren();
      caja.className = 'mt-4 rounded-lg p-4 ' + (v.ok ? 'bg-green-50 text-green-900' : 'bg-red-50 text-red-900');
      caja.appendChild(Ui.el('p', 'font-semibold', (v.ok ? '✔ ' : '✖ ') + (v.ok ? 'Las dos secuencias están correctas.' : 'Hay hallazgos que revisar.')));
      TIPOS.forEach((t) => {
        const x = v.porTipo[t];
        const bloque = Ui.el('div', 'mt-3 text-sm');
        bloque.appendChild(Ui.el('p', 'font-semibold', (x.ok ? '✔ ' : '✖ ') + NOMBRE[t] + ': último ' + x.contador + ', ' + x.total + ' radicado(s) por la app' + (x.base > 0 ? ', histórico manual hasta ' + x.base : '')));
        const detalle = (titulo, items) => {
          if (items.length) bloque.appendChild(Ui.el('p', 'mt-1', titulo + ': ' + items.join(', ')));
        };
        detalle('Consecutivos faltantes', x.faltantes);
        detalle('Consecutivos duplicados', x.duplicados);
        detalle('Dentro del rango histórico (conflicto)', x.bajoBase);
        detalle('Reservas sin completar', x.reservadasSinCompletar);
        detalle('Anuladas (cuentan en la secuencia)', x.anuladas);
        caja.appendChild(bloque);
      });
    }

    $('btn-validar').addEventListener('click', async (e) => {
      const b = e.currentTarget;
      b.disabled = true;
      b.textContent = 'Validando…';
      try {
        const r = await Api.validarSecuencia();
        if (!r.ok) throw new Error(r.mensaje);
        pintarValidacion(r.validacion, r.texto);
      } catch (err) {
        Ui.toast(err.message);
      } finally {
        b.disabled = false;
        b.textContent = 'Validar ahora';
      }
    });

    $('btn-csv').addEventListener('click', async (e) => {
      const b = e.currentTarget;
      b.disabled = true;
      try {
        const r = await Api.exportarRegistroCsv();
        if (!r.ok) throw new Error(r.mensaje);
        Ui.descargarTexto(r.nombre, r.csv);
      } catch (err) {
        Ui.toast(err.message);
      } finally {
        b.disabled = false;
      }
    });

    document.addEventListener('pagina', (e) => { if (e.detail === 'panel') cargar(); });
  })();
</script>
